services:
  # ==========================================
  # Backend: Viking Go API (Local Dev)
  # ==========================================
  viking-api:
    build: .
    container_name: viking_api_dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env # Trae todas las variables del .env
    environment:
      - SERVER_PORT=65298
      - DB_HOST=postgres_db # Apunta al contenedor postgres_db que ya tienes corriendo en mired2
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - UPLOAD_DIR=/root/uploads
      
      # Mapeo explícito
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBSCRIBER_EMAIL=${VAPID_SUBSCRIBER_EMAIL}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON}
    volumes:
      - viking_uploads:/root/uploads
    networks:
      - mired2
    deploy:
      resources:
        limits:
          memory: 250M
        reservations:
          memory: 50M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mired2"
      
      # Quitamos la regla del Host() para que puedas entrar desde el celular usando tu IP local
      - "traefik.http.routers.viking-api.rule=PathPrefix(`/viking`) || PathPrefix(`/auth`) || PathPrefix(`/api`) || PathPrefix(`/swagger`) || PathPrefix(`/public`)"
      - "traefik.http.routers.viking-api.entrypoints=web"
      - "traefik.http.routers.viking-api.priority=100"

      # Middlewares
      - "traefik.http.middlewares.viking-strip.stripprefix.prefixes=/viking"
      - "traefik.http.middlewares.upload-buffer.buffering.maxrequestbodybytes=104857600"
      - "traefik.http.middlewares.upload-buffer.buffering.memrequestbodybytes=10485760"

      - "traefik.http.routers.viking-api.middlewares=viking-strip,upload-buffer"
      - "traefik.http.services.viking-api.loadbalancer.server.port=65298"

networks:
  mired2:
    external: true

volumes:
  viking_uploads:
    name: viking_uploads_dev
