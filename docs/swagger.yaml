      tags:
      - Accounting
  /api/work-order/{orderId}:
    get:
      description: Retorna el detalle completo de una orden de trabajo individual
        por su UUID
      operationId: getWorkOrderById
      parameters:
      - description: Work Order UUID
        format: uuid
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorkOrderResponseDto'
      security:
      - bearer-jwt: []
      summary: Obtener Orden de Trabajo por ID
      tags:
      - Work Order Controller
  /api/work-order/delete/{orderId}:
    delete:
      description: Borra o cancela una orden de trabajo por UUID
      operationId: deleteWorkOrder
      parameters:
      - description: Work Order UUID
        format: uuid
        in: path
        name: orderId
        required: true
        type: string
      responses:
        "200":
          description: OK
      security:
      - bearer-jwt: []
      summary: Eliminar Orden de Trabajo
      tags:
      - Work Order Controller
  /api/work-order/regenerate-code/{orderId}:
    patch:
      description: Genera un nuevo código de seguridad inyectado en DTO y revoca el
        anterior (solo hash en BD)
      operationId: regenerateSecurityCode
      parameters:
      - description: Work Order UUID
        format: uuid
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SecurityCodeResponseDto'
      security:
      - bearer-jwt: []
      summary: Regenerar Código de Seguridad de Orden de Trabajo
      tags:
      - Work Order Controller
  /api/work-order/save:
    post:
      consumes:
      - application/json
      description: Genera una nueva orden uniendo clientId, deviceId, descripción
        del problema y estado inicial
      operationId: saveWorkOrder
      parameters:
      - description: Work Order Create Request
        in: body
        name: workOrder
        required: true
        schema:
          $ref: '#/definitions/models.WorkOrderCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorkOrderResponseDto'
      security:
      - bearer-jwt: []
      summary: Crear Orden de Trabajo
      tags:
      - Work Order Controller
  /api/work-order/search:
    get:
      description: Permite rastrear reparaciones por staffId, clientDni, deviceSerialNumber
        o término general
      operationId: searchWorkOrder
      parameters:
      - description: Staff UUID
        format: uuid
        in: query
        name: staffId
        type: string
      - description: Client DNI (búsqueda parcial incremental)
        in: query
        name: clientDni
        type: string
      - description: Device Serial Number
        in: query
        name: deviceSerialNumber
        type: string
      - description: Selector de campo o término general
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.WorkOrderSummaryDto'
            type: array
      security:
      - bearer-jwt: []
      summary: Buscar Órdenes de Trabajo
      tags:
      - Work Order Controller
  /api/work-order/update/{orderId}:
    patch:
      consumes:
      - application/json
      description: Cambia el estado de reparación de una orden (RECEIVED -> IN_PROGRESS
        -> DONE)
      operationId: updateWorkOrderStatus
      parameters:
      - description: Work Order UUID
        format: uuid
        in: path
        name: orderId
        required: true
        type: string
      - description: Status Update Request
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/models.WorkOrderStatusUpdateRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorkOrderResponseDto'
      security:
      - bearer-jwt: []
      summary: Actualizar Estado de Orden de Trabajo
      tags:
      - Work Order Controller
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica a un usuario y retorna su token JWT junto con la información
        de perfil y rol
      operationId: authenticateUser
      parameters:
      - description: Login Credentials
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/models.LoginUserDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.LoginResponseDto'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Iniciar Sesión
      tags:
      - Auth
  /auth/roles:
    get:
      description: Retorna la lista completa de roles disponibles en el sistema
      operationId: getAllRoles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Role'
            type: array
      security:
      - bearer-jwt: []
      summary: Listar Roles
      tags:
      - Role Controller
    post:
      consumes:
      - application/json
      description: Crea un nuevo rol
      operationId: createRole
      parameters:
      - description: Role Create Request
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/models.RoleCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
      security:
      - bearer-jwt: []
      summary: Crear Rol
      tags:
      - Role Controller
  /auth/roles/{id}:
    delete:
      description: Elimina un rol existente
      operationId: deleteRole
      parameters:
      - description: Role UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
      security:
      - bearer-jwt: []
      summary: Eliminar Rol
      tags:
      - Role Controller
    get:
      description: Busca un rol en la base de datos
      operationId: getRoleById
      parameters:
      - description: Role UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
      security:
      - bearer-jwt: []
      summary: Buscar Rol
      tags:
      - Role Controller
    put:
      consumes:
      - application/json
      description: Actualiza un rol existente
      operationId: updateRole
      parameters:
      - description: Role UUID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Role Update Request
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/models.RoleCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
      security:
      - bearer-jwt: []
      summary: Actualizar Rol
      tags:
      - Role Controller
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Crea y registra un nuevo usuario en la base de datos
      operationId: registerUser
      parameters:
      - description: Register Request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.RegisterDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation or business rule error
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      security:
      - bearer-jwt: []
      summary: Registrar Usuario
      tags:
      - Auth
  /auth/uploads/{filepath}:
    get:
      description: Carga un archivo o imagen desde el servidor (incluso en subcarpetas)
      operationId: serveFile
      parameters:
      - description: Ruta relativa del archivo
        in: path
        name: filepath
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Cargar archivo
      tags:
      - File Controller
  /auth/validate:
    get:
      description: Verifica si un token JWT enviado en la cabecera Authorization es
        válido
      operationId: validateToken
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
      summary: Validar Token JWT
      tags:
      - Auth
  /public/notifications/history:
    get:
      description: Permite la sincronización matutina (pull sync) al encender el servidor
        y actualiza la campanita interna
      operationId: getNotificationHistory
      parameters:
      - description: Work Order UUID
        format: uuid
        in: query
        name: workOrderId
        required: true
        type: string
      - description: Security Code
        in: query
        name: securityCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.NotificationHistoryResponseDto'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Obtener Historial de Notificaciones por Orden de Trabajo
      tags:
      - Notification Controller
  /public/notifications/mark-read:
    post:
      consumes:
      - application/json
      description: Actualiza el estado de las alertas en la base de datos a leídas
        para el contador de la campanita
      operationId: markNotificationHistoryAsRead
      parameters:
      - description: Work Order UUID
        format: uuid
        in: query
        name: workOrderId
        required: true
        type: string
      - description: Security Code
        in: query
        name: securityCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Marcar Todas las Notificaciones de una Orden como Leídas
      tags:
      - Notification Controller
  /public/notifications/subscribe:
    post:
      consumes:
      - application/json
      description: Registra el endpoint y claves de cifrado del navegador para alertas
        en tiempo real de una orden
      operationId: subscribePushNotification
      parameters:
      - description: Push Subscription Request
        in: body
        name: subscription
        required: true
        schema:
          $ref: '#/definitions/models.PushSubscriptionCreateRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PushSubscription'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Suscribir Navegador a Notificaciones WebPush
      tags:
      - Notification Controller
  /public/notifications/unsubscribe:
    post:
      consumes:
      - application/json
      description: Revoca o elimina la suscripción WebPush utilizando la URL del endpoint
      operationId: unsubscribePushNotification
      parameters:
      - description: Unsubscribe Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PushSubscriptionUnsubscribeRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Desuscribir Navegador de Notificaciones WebPush
      tags:
      - Notification Controller
  /public/work-order/budget/{workOrderId}:
    get:
      description: Obtiene la estructura desprotegida y sanitizada de un presupuesto
