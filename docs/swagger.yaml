        type: string
      - description: Security Code (WOVIK-XXXXX)
        in: query
        name: securityCode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BudgetResponseDto'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Obtener presupuesto público por ID de Orden de Trabajo
      tags:
      - Budget
  /public/work-order/status:
    post:
      consumes:
      - application/json
      description: Devuelve el estado, detalles y puntos de diagnóstico de una orden
