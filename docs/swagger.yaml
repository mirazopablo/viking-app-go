      tags:
      - Accounting
  /api/v1/sales-notes/{id}:
    get:
      parameters:
      - description: ID de la Nota de Venta
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SalesNote'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      security:
      - bearer-jwt: []
      summary: Obtener Nota de Venta por ID
      tags:
      - Accounting
  /api/v1/sales-notes/{id}/fiscalize:
    post:
      consumes:
      - application/json
      description: Emite Factura C oficial ante ARCA para una Nota de Venta previa
        y le asigna el CAE
      parameters:
      - description: ID de la Nota de Venta
        in: path
        name: id
        required: true
        type: integer
      - description: Datos fiscales del receptor
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.FiscalizeSalesNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
