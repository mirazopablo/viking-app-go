        required: true
        schema:
          $ref: '#/definitions/models.CreateSalesNoteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.SalesNote'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      security:
      - bearer-jwt: []
