host: 0.0.0.0:8080
info:
  contact:
    email: mirazopablo@gmail.com
    name: mirazopablo
  description: "Documentación de mi API Rest\n\nPara autenticarte:\n1. Usa el endpoint
    /auth/login para obtener el token\n2. Copia el token devuelto\n3. Click en el
    botón 'Authorize' (\U0001F513) arriba\n4. Pega el token en el campo 'Value' (incluye
    'Bearer ')"
  title: Viking-App ApiREST
  version: "1.0"
paths:
  /api/:
    get:
      description: Mensaje de bienvenida
      operationId: greeting
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      security:
      - bearer-jwt: []
      summary: Saludo
      tags:
      - Home Controller
  /api/budget/{id}/convert-to-sale-note:
    post:
      consumes:
      - application/json
      description: Transforma una cotización aprobada en una Nota de Venta interna
        en caja
      parameters:
      - description: ID del Presupuesto (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Datos de cobro
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/models.ConvertBudgetToSaleNoteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      security:
      - bearer-jwt: []
      summary: Convertir Presupuesto aprobado a Nota de Venta
      tags:
