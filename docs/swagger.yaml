      operationId: getPublicStatus
      parameters:
      - description: Public Query Request
        in: body
        name: query
        required: true
        schema:
          $ref: '#/definitions/models.WorkOrderPublicQueryRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorkOrderPublicStatusResponseDto'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Consulta Pública de Orden de Trabajo
      tags:
      - Work Order Controller
  /public/work-order/status-by-dni:
    post:
      consumes:
      - application/json
      description: Devuelve el estado, detalles y puntos de diagnóstico de una orden
        de trabajo si el DNI del cliente y securityCode coinciden
      operationId: getPublicStatusByDni
      parameters:
      - description: Public DNI Query Request
        in: body
        name: query
        required: true
        schema:
          $ref: '#/definitions/models.WorkOrderPublicDniQueryRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorkOrderPublicStatusResponseDto'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      summary: Consulta Pública de Orden de Trabajo por DNI
      tags:
      - Work Order Controller
securityDefinitions:
  bearer-jwt:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
