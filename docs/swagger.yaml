      - Invoices
  /api/v1/invoices/{id}:
    get:
      description: Obtiene el detalle de un comprobante emitido
      parameters:
      - description: ID de la factura
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Invoice'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      security:
      - bearer-jwt: []
      summary: Obtener factura por ID
      tags:
      - Invoices
  /api/v1/invoices/import-manual:
    post:
      consumes:
      - application/json
      description: Permite cargar manualmente una Factura emitida por fuera del sistema
        para cuadrar la contabilidad
      parameters:
      - description: Datos del comprobante emitido en ARCA
        in: body
        name: invoice
        required: true
        schema:
          $ref: '#/definitions/models.ImportManualInvoiceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Invoice'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperrors.ErrorResponse'
      security:
      - bearer-jwt: []
      summary: Registrar factura emitida externamente en ARCA (RCEL / Facturador)
      tags:
      - Invoices
  /api/v1/sales-notes:
    get:
      description: Obtiene un listado paginado de comprobantes de venta internos
      parameters:
      - default: 10
        description: Límite
        in: query
